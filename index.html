<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0e10">
<title>Quick Video Editor</title>
<style>
:root{--bg:#0e0e10;--bar:#151518;--panel:#1b1b1f;--btn:#26262b;--line:#2e2e34;--txt:#f2f2f4;--muted:#8e8e96;--yellow:#f7d51d;--blue:#3b82f6;--orange:#f59e0b;--pink:#ff2d6f;--green:#30d158}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:var(--txt);background:var(--btn);border:0;border-radius:10px;padding:8px 12px;font-size:15px;font-weight:600;cursor:pointer;touch-action:manipulation;min-height:40px}
button:active{filter:brightness(1.35)}
button:disabled{opacity:.35;pointer-events:none}
button.on{outline:2px solid var(--yellow)}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#topbar{flex:0 0 52px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--bar);border-bottom:1px solid var(--line)}
#topbar .title{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
#closeBtn{width:40px;padding:0;font-size:20px;background:transparent}
#saveBtn.saved{color:var(--muted)}
#exportBtn{background:var(--yellow);color:#000;font-weight:800;padding:8px 18px}
#work{flex:0 0 38%;min-height:190px;display:flex;position:relative}
#previewArea{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;min-width:0;min-height:0;position:relative}
#previewBox{position:relative;background:#000;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
#pv{display:block;width:100%;height:100%;touch-action:none}
#bigPlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);font-size:26px;padding:0;pointer-events:none}
#transport{flex:0 0 44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-top:1px solid var(--line)}
#transport .time{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
#transport .time span{color:var(--muted);font-weight:500}
#transport .sp{flex:1}
#playBtn{width:44px;padding:0;font-size:18px;background:transparent}
.iconbtn{background:transparent;font-size:20px;width:44px;padding:0}
#toolbar{flex:0 0 58px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--bar);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
#toolbar .tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:54px;height:48px;padding:2px 6px;background:transparent;font-size:11px;font-weight:600;color:var(--txt)}
#toolbar .tool b{font-size:19px;line-height:20px;font-weight:400}
#toolbar .tool.disabled{opacity:.35}
#cutsChip{flex:0 0 auto;background:#2a2a30;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;min-height:32px;white-space:nowrap}
#toolbar .sep{flex:0 0 1px;height:30px;background:var(--line);margin:0 2px}
#zoomBox{display:flex;align-items:center;gap:4px;margin-left:auto;flex:0 0 auto}
#zoomBox button{width:34px;min-height:34px;padding:0;font-size:18px;background:transparent}
#zoom{width:110px;accent-color:var(--yellow)}
#tlWrap{flex:1;min-height:180px;position:relative;background:var(--bg)}
#tl{position:absolute;inset:0;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
#tlInner{position:relative;min-height:100%}
#playhead{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#fff;pointer-events:none;z-index:5;box-shadow:0 0 4px rgba(0,0,0,.8)}
#playhead:before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top:8px solid #fff}
.ruler{position:absolute;height:22px;border-bottom:1px solid var(--line)}
.tick{position:absolute;bottom:0;width:1px;height:6px;background:#555}
.tick.major{height:10px;background:#888}
.tick span{position:absolute;bottom:10px;left:3px;font-size:10px;color:var(--muted);white-space:nowrap}
.blk{position:absolute;border-radius:6px;overflow:hidden;touch-action:pan-x pan-y;cursor:pointer}
.blk.sel{touch-action:none;box-shadow:0 0 0 2px #fff;z-index:3;overflow:visible}
.blk .lbl{position:absolute;left:5px;top:2px;right:4px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.cap{background:var(--blue);height:24px}
.cap .lbl{top:5px}
.img{background:var(--orange);height:26px}
.img .lbl{top:6px;color:#1a1000;text-shadow:none}
.broll{background:#222;height:42px;box-shadow:0 0 0 2px var(--yellow)}
.broll.sel{box-shadow:0 0 0 3px #fff}
.seg{background:#333;height:58px}
.seg canvas,.broll canvas,.aud canvas{position:absolute;left:0;top:0;height:100%;pointer-events:none;border-radius:6px}
.seg .lbl{top:auto;bottom:3px;left:4px;right:auto;background:rgba(0,0,0,.6);border-radius:4px;padding:1px 4px;font-size:10px}
.aud{background:#0f5132;height:30px}
.aud .lbl{top:7px}
.h{position:absolute;top:0;bottom:0;width:16px;background:#fff;z-index:2;display:flex;align-items:center;justify-content:center;color:#000;font-size:12px;font-weight:900;touch-action:none}
.h.l{left:-8px;border-radius:5px 0 0 5px}
.h.r{right:-8px;border-radius:0 5px 5px 0}
.cutmark{position:absolute;width:6px;height:22px;margin-left:-3px;background:#fff;border-radius:3px;pointer-events:none;z-index:4;box-shadow:0 0 0 2px #000}
.cover{position:absolute;width:52px;height:58px;border-radius:6px;overflow:hidden;background:#333;padding:0;min-height:0}
.cover canvas{width:100%;height:100%;display:block}
.cover span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);font-size:10px;font-weight:700;padding:2px 0;text-align:center}
.addclip{position:absolute;width:40px;height:58px;min-height:0;padding:0;font-size:24px;border-radius:6px;background:#fff;color:#000}
.addaudio{position:absolute;height:30px;min-height:0;padding:0 12px;font-size:12px;border-radius:6px;background:#1f2a24;color:#9fe3b8}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:52%;background:var(--panel);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .22s ease;z-index:20;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#sheet.open{transform:none}
#sheetHead{display:flex;align-items:center;padding:10px 12px 6px;gap:8px}
#sheetHead b{flex:1;font-size:16px}
#sheetDone{background:var(--yellow);color:#000}
#sheetBody{overflow:auto;padding:4px 12px 16px}
.hint{color:var(--muted);font-size:13px;line-height:1.35;margin:4px 0 8px}
.g2,.g3{display:grid;gap:8px;margin:8px 0}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.addgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:74px;font-size:13px}
.addgrid button b{font-size:24px;font-weight:400}
#sheetBody textarea{width:100%;font:inherit;font-size:17px;font-weight:700;border:0;border-radius:10px;padding:10px;background:#000;color:#fff;min-height:64px;resize:vertical;-webkit-user-select:text;user-select:text}
#sheetBody label{display:flex;align-items:center;gap:10px;font-size:14px;margin:10px 0;color:var(--muted)}
#sheetBody label input[type=range]{flex:1;accent-color:var(--yellow)}
#sheetBody .danger{background:#3a1d22;color:#ff8b9b;width:100%}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (min-width:900px){
  #work{flex:1}
  #sheet{position:static;transform:none;max-height:none;width:340px;border-radius:0;box-shadow:none;border-left:1px solid var(--line);background:var(--bar);transition:none;padding-bottom:0}
  #sheetDone{display:none}
  #tlWrap{flex:0 0 300px}
  #toolbar .tool{min-width:62px}
}
#start{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#start h1{font-size:26px;margin:0 0 6px}
#start p{color:var(--muted);max-width:380px;line-height:1.45}
#pickBtn{background:var(--yellow);color:#000;font-size:22px;font-weight:800;padding:22px 34px;border-radius:18px;margin-top:14px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{background:var(--panel);border-radius:18px;padding:16px;width:100%;max-width:420px;max-height:92%;overflow:auto}
.modal h2{margin:0 0 6px;font-size:19px}
.modal video,.modal img{width:100%;max-height:46vh;object-fit:contain;background:#000;border-radius:10px;margin-top:8px}
.modal progress{width:100%;height:16px;accent-color:var(--yellow)}
.big{width:100%;min-height:56px;font-size:18px;font-weight:800;margin-top:10px}
.yellow{background:var(--yellow);color:#000}
.opt{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--btn);margin:6px 0;font-size:15px}
.opt input{accent-color:var(--yellow);width:20px;height:20px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 62px);transform:translateX(-50%);background:#fff;color:#000;font-weight:700;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center;font-size:14px}
#toast.show{opacity:1}
#hiddenMedia{position:fixed;left:0;bottom:0;width:2px;height:2px;overflow:hidden;opacity:.01;pointer-events:none;z-index:-1}
#hiddenMedia video,#hiddenMedia canvas{width:2px;height:2px}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="closeBtn" title="Close">✕</button>
    <div class="title" id="projTitle">Quick Editor</div>
    <button id="saveBtn" class="saved">Save changes</button>
    <button id="exportBtn">Export</button>
  </header>
  <main id="work">
    <section id="previewArea"><div id="previewBox"><canvas id="pv"></canvas><button id="bigPlay">▶</button></div></section>
    <aside id="sheet">
      <div id="sheetHead"><b id="sheetTitle">Add</b><button id="sheetDone">Done</button></div>
      <div id="sheetBody"></div>
    </aside>
  </main>
  <div id="transport">
    <button id="playBtn" title="Play (space)">▶</button>
    <div class="time"><b id="tNow">0:00.0</b> <span>/ <span id="tTotal">0:00.0</span></span></div>
    <div class="sp"></div>
    <button id="undoBtn" class="iconbtn" title="Undo">↶</button>
    <button id="redoBtn" class="iconbtn" title="Redo">↷</button>
  </div>
  <div id="toolbar">
    <button id="cutsChip">✂ 0 cuts</button>
    <div class="sep"></div>
    <button class="tool" id="tAdd"><b>＋</b>Add</button>
    <button class="tool" id="tDone"><b>✓</b>Done</button>
    <button class="tool" id="tSplit"><b>✂︎</b>Split</button>
    <button class="tool" id="tRotate"><b>⟳</b>Rotate</button>
    <button class="tool" id="tSize"><b>⤢</b>Size</button>
    <button class="tool" id="tCrop"><b>⌗</b>Crop</button>
    <button class="tool" id="tLayer"><b>❏</b>Layer</button>
    <button class="tool" id="tDelete"><b>🗑</b>Delete</button>
    <div id="zoomBox"><button id="zOut">−</button><input type="range" id="zoom" min="0" max="100" value="30"><button id="zIn">+</button></div>
  </div>
  <div id="tlWrap"><div id="tl"><div id="tlInner"></div></div><div id="playhead"></div></div>
</div>
<div id="start">
  <h1>🎬 Quick Editor</h1>
  <p>Pick your video from Photos or Files. Everything stays on your device, nothing is uploaded. Pick the same video again later to pick up where you left off.</p>
  <button id="pickBtn">📂 Pick a video</button>
</div>
<div class="modal hidden" id="exportModal"><div class="card" id="exportCard"></div></div>
<div class="modal hidden" id="coverModal"><div class="card" id="coverCard"></div></div>
<input type="file" id="fileMain" accept="video/*,.mp4,.mov" class="hidden">
<input type="file" id="fileImage" accept="image/*" class="hidden">
<input type="file" id="fileBroll" accept="video/*,.mp4,.mov" class="hidden">
<input type="file" id="fileAudio" accept="audio/*,video/*,.mp3,.m4a,.wav,.aac,.mp4,.mov" class="hidden">
<input type="file" id="fileSrt" accept=".srt,.vtt,text/plain,application/x-subrip" class="hidden">
<div id="hiddenMedia"><video id="mainVideo" playsinline webkit-playsinline preload="auto"></video><canvas id="exportCanvas"></canvas></div>
<div id="toast"></div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const main = $('mainVideo'), pv = $('pv'), tl = $('tl'), tlInner = $('tlInner');
const POS = { top:0.17, middle:0.5, bottom:0.72 };
const SIZE = { s:0.055, m:0.072, l:0.095 };
const MINLEN = 0.1;
const isDesktop = () => matchMedia('(min-width:900px)').matches;
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
const fmtR = t => { const m = Math.floor(t / 60), s = Math.round(t - m * 60); return m + ':' + (s < 10 ? '0' : '') + s; };
const toast = msg => { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2000); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

const fresh = d => ({ segs:[{ id:uid(), s:0, e:d }], caps:[], ovl:[], audio:[], fit:'fill', rot:0, crop:{ z:1, x:0, y:0 }, vol:1 });
let state = null, sel = null, sheetMode = null, duration = 0, srcKey = null, srcName = 'video';
let undoSt = [], redoSt = [];
let media = {}, brollEls = {}, mainThumbs = [];
let pps = 40, tOut = 0, curSeg = 0, playing = false, exporting = false, cancelExport = false, dragging = false;
let srcFps = 30;
let actx = null, mainGain = null, mix = null, monitor = null, recDest = null, musicNodes = [];

const total = () => state ? state.segs.reduce((a, s) => a + (s.e - s.s), 0) : 0;
const offsets = () => { const o = []; let a = 0; for (const s of state.segs) { o.push(a); a += s.e - s.s; } return o; };
function outToSrc(t) {
  const o = offsets(), n = state.segs.length;
  for (let i = 0; i < n; i++) { const s = state.segs[i]; if (t < o[i] + (s.e - s.s) || i === n - 1) return { i, src: clamp(s.s + (t - o[i]), s.s, s.e) }; }
  return { i:0, src:0 };
}
function srcToOut(src) { const o = offsets(); for (let i = 0; i < state.segs.length; i++) { const s = state.segs[i]; if (src >= s.s - 1e-3 && src < s.e) return o[i] + (src - s.s); } return null; }
function getItem(ref) {
  if (!ref || !state) return null;
  const list = ref.t === 'seg' ? state.segs : ref.t === 'cap' ? state.caps : ref.t === 'ovl' ? state.ovl : state.audio;
  return list.find(x => x.id === ref.id) || null;
}
function cutsCount() {
  const iv = state.segs.map(s => [s.s, s.e]).sort((a, b) => a[0] - b[0]); let n = 0, cur = 0;
  for (const [a, b] of iv) { if (a > cur + 0.05) n++; cur = Math.max(cur, b); }
  if (duration > cur + 0.05) n++;
  return n;
}
// anchors keep captions/overlays glued to the footage when clips are cut or moved
function captureAnchors() {
  const A = [];
  for (const [k, list] of [['cap', state.caps], ['ovl', state.ovl]]) for (const it of list) { const r = outToSrc(it.s + 1e-4); A.push({ k, it, segId: state.segs[r.i] && state.segs[r.i].id, src: r.src, len: it.e - it.s }); }
  return A;
}
function applyAnchors(A) {
  const T = total(), o = offsets(), drop = new Set();
  for (const a of A) {
    let pos = null; const idx = state.segs.findIndex(x => x.id === a.segId); const sg = state.segs[idx];
    if (sg && a.src >= sg.s - 1e-3 && a.src < sg.e) pos = o[idx] + a.src - sg.s; else pos = srcToOut(a.src);
    if (pos === null) { if (a.k === 'cap') { drop.add(a.it); continue; } pos = Math.min(a.it.s, Math.max(0, T - 0.5)); }
    a.it.s = pos; a.it.e = Math.min(T, pos + a.len);
    if (a.it.e - a.it.s < MINLEN) { if (a.k === 'cap') drop.add(a.it); else a.it.s = Math.max(0, a.it.e - 0.5); }
  }
  state.caps = state.caps.filter(c => !drop.has(c));
  for (const a of state.audio) { a.e = Math.min(a.e, T); if (a.s > T - MINLEN) a.s = Math.max(0, T - 1); }
}
function pushUndo(snap) { undoSt.push(snap || JSON.stringify(state)); if (undoSt.length > 80) undoSt.shift(); redoSt = []; updUndo(); }
function commit(fn, ripple) { const A = ripple ? captureAnchors() : null; pushUndo(); fn(); if (A) applyAnchors(A); afterChange(); }
function afterChange() {
  if (sel && !getItem(sel)) sel = null;
  if (tOut > total()) tOut = total();
  ensureBrollEls(); renderAll(); seek(tOut, 'keep'); dirty();
}
function updUndo() { $('undoBtn').disabled = !undoSt.length; $('redoBtn').disabled = !redoSt.length; }
function undo() { if (!undoSt.length || exporting) return; pause(); redoSt.push(JSON.stringify(state)); state = JSON.parse(undoSt.pop()); updUndo(); afterChange(); toast('Undo'); }
function redo() { if (!redoSt.length || exporting) return; pause(); undoSt.push(JSON.stringify(state)); state = JSON.parse(redoSt.pop()); updUndo(); afterChange(); toast('Redo'); }

// persistence (IndexedDB)
let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => { const r = indexedDB.open('quick-video-editor', 1); r.onupgradeneeded = () => { r.result.createObjectStore('projects'); r.result.createObjectStore('media'); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return dbp;
}
async function idb(store, mode, fn) { const d = await db(); return new Promise((res, rej) => { const tx = d.transaction(store, mode); const r = fn(tx.objectStore(store)); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); }
const idbGet = (s, k) => idb(s, 'readonly', st => st.get(k));
const idbPut = (s, k, v) => idb(s, 'readwrite', st => st.put(v, k));
let saveTimer = null, unsaved = false;
function dirty() { unsaved = true; const b = $('saveBtn'); b.textContent = 'Save changes'; b.classList.remove('saved'); clearTimeout(saveTimer); saveTimer = setTimeout(() => save(false), 2500); }
async function save(manual) {
  clearTimeout(saveTimer); if (!srcKey || !state) return;
  try { await idbPut('projects', srcKey, { state, name:srcName, savedAt:Date.now() }); unsaved = false; const b = $('saveBtn'); b.textContent = 'Saved ✓'; b.classList.add('saved'); if (manual) toast('Saved on this device'); }
  catch (e) { console.warn(e); if (manual) toast('Could not save (storage full?)'); }
}
// media
const once = (el, ev, ms = 8000) => new Promise(r => { const f = () => { el.removeEventListener(ev, f); r(); }; el.addEventListener(ev, f); setTimeout(f, ms); });
const seekEl = (el, t) => { const p = once(el, 'seeked', 3000); el.currentTime = t; return p; };
async function makeThumbs(url, dur, count, h, onProg) {
  const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto'; v.src = url;
  $('hiddenMedia').appendChild(v);
  await once(v, 'loadeddata');
  try { await v.play(); v.pause(); } catch (e) {}
  const asp = (v.videoWidth || 9) / (v.videoHeight || 16); const w = Math.max(8, Math.round(h * asp)); const out = [];
  for (let i = 0; i < count; i++) {
    const t = Math.min(Math.max(0, dur - 0.05), (i + 0.5) * dur / count);
    await seekEl(v, t);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    try { c.getContext('2d').drawImage(v, 0, 0, w, h); } catch (e) {}
    out.push({ t, c });
    if (onProg && (i % 8 === 7 || i === count - 1)) onProg(out.slice());
  }
  v.removeAttribute('src'); v.load(); v.remove();
  return out;
}
const thumbAt = (thumbs, t) => { if (!thumbs.length) return null; let best = thumbs[0]; for (const th of thumbs) if (Math.abs(th.t - t) < Math.abs(best.t - t)) best = th; return best.c; };
